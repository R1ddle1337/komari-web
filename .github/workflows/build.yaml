name: Build Owned Frontend

on:
  push:
    branches: [owned]
  pull_request:
    branches: [owned]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new theme release from the current owned commit
        type: boolean
        default: false
      version:
        description: New semantic version; required only when publishing
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'R1ddle1337/komari-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: timeout 60s npm run test:owned
      - run: timeout 60s npm run test:onboarding
      - run: timeout 60s npm run test:network
      - run: timeout 60s npm run test:security
      - run: npm run build
      - name: Package theme built from this source
        run: |
          set -euo pipefail
          mkdir -p theme-package
          cp -r dist theme-package/dist
          cp komari-theme.json theme-package/
          for preview in preview.png perview.png; do
            if [ -f "$preview" ]; then cp "$preview" theme-package/; fi
          done
          (cd theme-package && zip -qr ../komari-theme.zip .)
          sha256sum komari-theme.zip > komari-theme.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-frontend
          path: |
            komari-theme.zip
            komari-theme.zip.sha256

  publish:
    if: github.repository == 'R1ddle1337/komari-web' && github.ref == 'refs/heads/owned' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: owned-frontend
      - name: Publish only a new owned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          current_owned="$(gh api repos/R1ddle1337/komari-web/git/ref/heads/owned --jq .object.sha)"
          test "$current_owned" = "$GITHUB_SHA"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "The tag already exists; choose a new owned version." >&2
            exit 1
          fi
          sha256sum --strict --check komari-theme.zip.sha256
          gh release create "$VERSION" komari-theme.zip komari-theme.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes "Owned frontend built from commit $GITHUB_SHA."
